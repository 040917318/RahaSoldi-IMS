<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raha Soldi Inventory</title>
    <meta name="description" content="A comprehensive sales and inventory management system for Raha Soldi Ent (Ghana), featuring stock tracking, point of sale, and AI-powered business insights." />
    <meta property="og:title" content="Raha Soldi Inventory" />
    <meta property="og:description" content="A comprehensive sales and inventory management system for Raha Soldi Ent (Ghana), featuring stock tracking, point of sale, and AI-powered business insights." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1e3a8a', // Corporate Blue
              secondary: '#fbbf24', // Gold/Yellow accent
              accent: '#dc2626', // Red accent
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.5);
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #6366f1; /* Indigo-500 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #4f46e5; /* Indigo-600 */
      }

      .custom-scrollbar-lg::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-thumb {
        background: #6366f1; /* Indigo-500 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-thumb:hover {
        background: #4f46e5; /* Indigo-600 */
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>

<script>
  // Prevent FOUC (Flash of Unstyled Content) for dark mode
  if (localStorage.getItem('darkMode') === 'true' || (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
</script>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
