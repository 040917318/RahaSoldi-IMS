<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Raha Soldi Inventory</title>
    <meta name="description" content="A comprehensive sales and inventory management system for Raha Soldi Ent (Ghana), featuring stock tracking, point of sale, and AI-powered business insights." />
    <meta property="og:title" content="Raha Soldi Inventory" />
    <meta property="og:description" content="A comprehensive sales and inventory management system for Raha Soldi Ent (Ghana), featuring stock tracking, point of sale, and AI-powered business insights." />
    
    <!-- High-priority DNS prefetch and preconnect for fastest network initialization -->
    <link rel="preconnect" href="https://nzbiinvwweopegmajfsm.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nzbiinvwweopegmajfsm.supabase.co" />
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1e3a8a', // Corporate Blue
              secondary: '#fbbf24', // Gold/Yellow accent
              accent: '#dc2626', // Red accent
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        -webkit-text-size-adjust: 100%;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      /* Safe area padding utilities for modern smartphones */
      .safe-bottom {
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0.75rem));
      }
      .safe-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.5);
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #6366f1; /* Indigo-500 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #4f46e5; /* Indigo-600 */
      }

      .custom-scrollbar-lg::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-thumb {
        background: #6366f1; /* Indigo-500 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar-lg::-webkit-scrollbar-thumb:hover {
        background: #4f46e5; /* Indigo-600 */
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>

<script>
  // Prevent FOUC (Flash of Unstyled Content) for dark mode
  if (localStorage.getItem('darkMode') === 'true' || (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
</script>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
